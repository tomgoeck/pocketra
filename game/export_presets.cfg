[preset.5.options]

application/app_store_team_id="9HW65ZP3L9"
application/bundle_identifier="dev.tom.pocketra"
; Leer = automatische Signierung durch Xcode (code_sign_style „Automatic"); die Identität
; „Apple Development: tom@attomic.de (HF45S99Z5G)" liegt im Schlüsselbund — die Klammer im Namen ist
; NICHT die Team-ID, die steht im Zertifikat als OU=9HW65ZP3L9 (Tom Göckeritz) und gehört zum
; vorhandenen Sammelprofil „iOS Team Provisioning Profile: *" (9HW65ZP3L9.*).
application/code_sign_identity_debug=""
; NICHT leer lassen (Toms Befund 2026-09-09: „conflicting provisioning settings"). Godot setzt bei
; einem leeren Feld woertlich CODE_SIGN_IDENTITY = "Apple Distribution" in die Release-Konfiguration
; und laesst CODE_SIGN_STYLE trotzdem auf Automatic — Xcode bricht mit genau dieser Meldung ab.
; Beleg: editor/export/editor_export_platform_apple_embedded.h, struct CodeSigningDetails:
;   release_signing_identity = …is_empty() ? "Apple Distribution" : …;
;   release_manual_signing = !uuid.is_empty()
;       || (release_signing_identity != "Apple Development" && release_signing_identity != "Apple Distribution");
; „Apple Development" ist also ausdruecklich zugelassen, OHNE dass Godot auf Manual umschaltet — das
; Xcode-Projekt ist damit von sich aus stimmig, auch wenn man es von Hand oeffnet und archiviert.
; Auf das Verteilzertifikat signiert erst der Export um (method „app-store-connect",
; signingStyle „automatic" — tools/ipa_build.sh, Zweig --store).
application/code_sign_identity_release="Apple Development"
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""
; 1 = Development (0 App Store, 2 Ad-Hoc, 3 Enterprise)
application/export_method_debug=1
application/export_method_release=1
; Godot erzeugt nur das Xcode-Projekt; Bauen, Signieren und Aufspielen macht xcodebuild/devicectl
application/export_project_only=true
; 2 = iPhone & iPad
application/targeted_device_family=2
application/short_version="0.24"
application/version="28"
capabilities/access_wifi=false
capabilities/performance_a12=false
capabilities/performance_gaming_tier=false
; Originaldateien (Freeware-ISO, MIX-Archive) lassen sich per Dateien-App in den App-Ordner legen —
; OriginalContent sucht dort zuerst (user://original, scripts/original_content.gd)
user_data/accessible_from_files_app=true
user_data/accessible_from_itunes_sharing=true
; Mikrofon fuer den Sprechfunk (docs/MULTIPLAYER.md §11.4). OHNE DIESEN EINTRAG BEENDET iOS DIE APP
; beim ersten Zugriff auf den Eingang — kein Fehler, kein Dialog, die App ist einfach weg.
; Die beiden Schluesselnamen sind am Godot-Quelltext geprueft (Zweig 4.7,
; editor/export/editor_export_platform_apple_embedded.cpp:1972-2026):
;   * `privacy/microphone_usage_description` landet in der Info.plist UND in en.lproj/InfoPlist.strings
;     (Zeile 1992) — die Grundfassung ist also ENGLISCH;
;   * `privacy/microphone_usage_description_localized` ist ein Woerterbuch Sprache → Text und wird je
;     Sprache nach <lang>.lproj/InfoPlist.strings geschrieben (Zeile 2020-2022), "en" dabei
;     uebersprungen (Zeile 1997). Deutsch gehoert also hierhin.
; Godot schreibt die Zeile nur, wenn ueberhaupt Uebersetzungen im Projekt stehen (Zeile 1983) — das
; ist bei uns der Fall (de/en, internationalization/locale/translations in project.godot).
; Wortlaut: Apple verlangt, dass der Satz den KONKRETEN Zweck nennt; „Diese App braucht das
; Mikrofon" wird abgelehnt.
privacy/microphone_usage_description="PocketRA uses the microphone only for voice chat with the other players in a multiplayer match. Your audio goes straight to them and is never recorded, stored or uploaded."
privacy/microphone_usage_description_localized={
"de": "PocketRA nutzt das Mikrofon ausschliesslich fuer den Sprechfunk mit den anderen Spielern in einer Mehrspielerpartie. Dein Ton geht direkt an sie und wird nirgends aufgezeichnet, gespeichert oder hochgeladen."
}

