[preset.2]

name="Update-Paket"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/**,data/**"
; Stufe 1 der Aktualisierung (Toms Wunsch 2026-09-04: Freunde sollen nicht staendig eine neue APK
; bekommen). Dieses Preset wird NIE als APK exportiert, sondern nur mit
;   Godot --headless --path game --export-pack "Update-Paket" ../build/update/update.pck
; (tools/update_pack.sh). Godot erlaubt --export-pack bei jedem Preset; die Plattform ist dabei egal,
; sie bestimmt nur, welche Feature-Tags beim Filtern gelten — Android passt zum Zielgeraet.
;
; Inhalt = genau die Menge des Presets "Android Verteilung" (scripts, scenes, i18n, icons, data/**,
; assets/rules.json, assets/maps/**, assets/ui/**, assets/music/**, assets/intro/**), zusaetzlich
; OHNE bin/**: die native GDExtension (rasim.gdextension + .so) steckt in der APK und wechselt nur
; mit ihr. Ein Paket, das eine neuere Extension braucht, traegt stattdessen min_extension in
; version.json — UpdateBoot haengt es dann gar nicht erst ein.
exclude_filter="assets/atlas/**,assets/sfx/**,assets/video/**,bin/**"
export_path="../build/update/update.pck"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

