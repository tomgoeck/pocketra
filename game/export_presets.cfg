; Mikrofon fuer den Sprechfunk (docs/MULTIPLAYER.md §11.2). Anders als bei iOS (preset.5) fehlte
; dieser Schluessel hier ganz — Godots macOS-Exporter schreibt NSMicrophoneUsageDescription nur,
; wenn er gesetzt ist. Ohne den Eintrag fragt macOS die Freigabe gar nicht erst ab: kein Dialog,
; kein Eintrag unter Systemeinstellungen > Datenschutz > Mikrofon (Toms Befund 2026-09-10, Mac-Test
; der Sprechfunk-Vorlage). Wortlaut wie beim iOS-Preset.
privacy/microphone_usage_description="PocketRA uses the microphone only for voice chat with the other players in a multiplayer match. Your audio goes straight to them and is never recorded, stored or uploaded."
