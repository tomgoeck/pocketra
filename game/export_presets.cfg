; Schlanke Variante desselben Pakets (tools/update_pack.sh --slim). Gleicher Zweck wie
; "Update-Paket", laesst aber alles weg, was sich zwischen zwei Fassungen praktisch nie aendert und
; den Download aufblaeht: assets/music (58 MB, Toms zwoelf Stuecke), assets/ui (22 MB,
; Menue-Hintergruende) und assets/intro. Ergebnis rund 32 statt 116 MB.
;
; Das ist gefahrlos, weil load_resource_pack(path, true) nur die Dateien ersetzt, die im Paket
; stecken — alles andere kommt weiter aus der APK. Aendert Tom Musik, Menuebild oder Intro, muss er
; entweder eine neue APK verteilen oder einmal das volle Preset "Update-Paket" benutzen.
