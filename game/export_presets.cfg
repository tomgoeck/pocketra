[preset.1]

name="Android Verteilung"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/**,data/**"
; Verteilung ohne EA-Inhalte (Toms Entscheidung, project-docs Decisions „Verteilung ohne EA-Inhalte"):
; Atlanten (Sprites/Terrain aus den MIX-Archiven), Sound-/Stimmeffekte und die EA-Missionsfilme
; (deutsch wie englisch, assets/video/**) werden zur Laufzeit über die Seite „Spielinhalte einrichten"
; nachgeladen (ContentManager/ContentPage, user://content/). Toms eigenes Intro liegt bewusst NICHT
; unter assets/video/, sondern in einem eigenen Ordner assets/intro/intro.ogv (game/scripts/intro.gd) —
; ein exclude_filter-Treffer gewinnt gegen ein include_filter für dieselbe Datei (geprüft: „assets/
; video/**" ausschließen und „assets/video/intro.ogv" per include_filter zurückholen ließ die Datei
; trotzdem weg), ein eigener Ordner umgeht das sauber. assets/rules.json (aus OpenRAs GPL-Regeldateien
; erzeugt, nicht aus den EA-MIX-Archiven), assets/maps/** (aus OpenRAs GPL-Karten erzeugt) und
; assets/music/** (Toms eigene zwölf Stücke, kein EA-Material) bleiben ungefiltert mit drin.
; data/** (Atlas-Rezepte, OpenRA-Sprites, Namensverzeichnis, Soundliste — eigene und GPL-Daten) muss
; mit, sonst kann RaContent auf dem Gerät keine Atlanten bauen.
exclude_filter="assets/atlas/**,assets/sfx/**,assets/video/**"
export_path="../build/pocketra-dist.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

