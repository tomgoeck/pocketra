# Mehrspieler-Vermittler: WebSocket-Weiterleitung /mp -> 127.0.0.1:8787
# tools/mp_deploy.sh fuegt diesen Block einmalig in den 443-Block von
# /etc/nginx/sites-available/pocketra.net ein (nur wenn "location /mp" dort fehlt).
    location /mp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        access_log /var/log/nginx/pocketra-mp.access.log;
    }
